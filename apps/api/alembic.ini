[alembic]
script_location = migrations
prepend_sys_path =.
version_path_separator = os
sqlalchemy.url = postgresql://neondb_owner:npg_aX14oNTxkmFZ@ep-nameless-hill-b7abkv7r-pooler.c-13.us-east-1.aws.neon.tech/jenath-db?sslmode=require&channel_binding=require

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
