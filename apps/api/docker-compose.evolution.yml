services:
  evolution:
    image: atendai/evolution-api:latest
    container_name: evolution_jos
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SERVER_TYPE=http
      - SERVER_PORT=8080
      - SERVER_URL=http://localhost:8080
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=JOS_2026_CHAVE_SUPER_SECRETA_123
      - QRCODE_LIMIT=30
      - QRCODE_COLOR=#198754
      - DATABASE_ENABLED=false
    volumes:
      - ./evolution_instances:/evolution/instances
      - ./evolution_store:/evolution/store
